name: Build

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'v*'
  pull_request:
    tags:
      - 'v*'
    branches:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # required by the "Publish release" step below
    env:
      ARTIFACT_NAME: ArkPets
    steps:
      - name: Show meta info
        run: |
          echo "Current ref: ${{ github.ref }}"
          echo "Current sha: ${{ github.sha }}"

      - name: Checkout repo
        uses: actions/checkout@v6

      # The launcher discovers new versions by reading the tag of the latest GitHub Release and
      # comparing it against Const.appVersion. If those two ever disagree with the tag being built,
      # every installed copy keeps believing it is out of date and offers the same update forever.
      - name: Verify version consistency
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          GRADLE_VER=$(sed -n 's/^[[:space:]]*version = "\(.*\)"/\1/p' build.gradle | head -1)
          CONST_VER=$(sed -n 's/.*appVersion *= *new Version(\([0-9]*\), *\([0-9]*\), *\([0-9]*\)).*/\1.\2.\3/p' core/src/cn/harryh/arkpets/Const.java | head -1)
          ISS_VER=$(sed -n 's/^#define MyAppVersion "\(.*\)"/\1/p' docs/scripts/ExePacking.iss | head -1)
          echo "tag=v$TAG  build.gradle=$GRADLE_VER  Const.appVersion=$CONST_VER  ExePacking.iss=$ISS_VER"
          for found in "$GRADLE_VER" "$CONST_VER" "$ISS_VER"; do
            if [ "$found" != "$TAG" ]; then
              echo "::error::Version mismatch: the tag is v$TAG but a version location still says '$found'. Update build.gradle, Const.appVersion and ExePacking.iss together."
              exit 1
            fi
          done

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'liberica'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.14.3'

      - name: Setup Inno Setup
        run: choco install innosetup --no-progress

      - name: Execute gradle tasks
        run: gradle clean distAll
        env:
          ORG_GRADLE_PROJECT_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Upload exe
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.ARTIFACT_NAME }}-Setup.exe
          path: desktop/build/dist/*.exe

      - name: Upload zip
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.ARTIFACT_NAME }}.zip
          path: desktop/build/dist/*.zip

      - name: Upload jar
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.ARTIFACT_NAME }}.jar
          path: desktop/build/dist/*.jar

      # Publishes the installer as a GitHub Release, which is what the in-app updater downloads
      # from. Only a tag push triggers this; a push to the v3.x branch just uploads artifacts.
      # The fallback re-uploads into an existing release, so re-running the job on the same tag works.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" --generate-notes \
            desktop/build/dist/*.exe desktop/build/dist/*.zip \
          || gh release upload "${GITHUB_REF_NAME}" \
            desktop/build/dist/*.exe desktop/build/dist/*.zip --clobber
